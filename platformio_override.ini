; Ashish Automation clock build environments
; Works for WLED 0.14.4, 0.15.0, 0.15.1, 0.15.3, 0.15.4, 16.0.0 and 16.0.1
; (custom_usermods is used by WLED 16 only, older versions simply ignore it)
;
; FIRMWARE DEFAULT SETTINGS (used on a fresh install or after a factory reset):
;   PIXEL_COUNTS=53           LED count 53  (6 digits x 7 segments + 2 colons x 2 + 7 weekday LEDs)
;   ABL_MILLIAMPS_DEFAULT=2000  LED power limit 2000 mA

[env:ashish_esp8266]
extends = env:nodemcuv2
custom_usermods = ashish_clock_7seg
build_flags = ${env:nodemcuv2.build_flags} -D USERMOD_ASHISH_CLOCK7SEG -D PIXEL_COUNTS=53 -D ABL_MILLIAMPS_DEFAULT=2000

[env:ashish_esp8266_1m]
extends = env:esp01_1m_full
custom_usermods = ashish_clock_7seg
build_flags = ${env:esp01_1m_full.build_flags} -D USERMOD_ASHISH_CLOCK7SEG -D PIXEL_COUNTS=53 -D ABL_MILLIAMPS_DEFAULT=2000

[env:ashish_esp32]
extends = env:esp32dev
custom_usermods = ashish_clock_7seg
build_flags = ${env:esp32dev.build_flags} -D USERMOD_ASHISH_CLOCK7SEG -D PIXEL_COUNTS=53 -D ABL_MILLIAMPS_DEFAULT=2000
