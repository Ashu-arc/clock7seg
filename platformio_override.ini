; Clock7Seg Pro build environments (WLED 0.14.x)
; Build from PlatformIO or let the GitHub workflow do it for you.

[env:clock7seg_esp8266]
extends = env:nodemcuv2
build_flags = ${env:nodemcuv2.build_flags} -D USERMOD_CLOCK7SEG

[env:clock7seg_esp8266_1m]
extends = env:esp01_1m_full
build_flags = ${env:esp01_1m_full.build_flags} -D USERMOD_CLOCK7SEG

[env:clock7seg_esp32]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -D USERMOD_CLOCK7SEG
