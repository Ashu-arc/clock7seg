; Ashish Automation clock build environments (WLED 0.15.0)

[env:ashish_esp8266]
extends = env:nodemcuv2
build_flags = ${env:nodemcuv2.build_flags} -D USERMOD_ASHISH_CLOCK7SEG

[env:ashish_esp8266_1m]
extends = env:esp01_1m_full
build_flags = ${env:esp01_1m_full.build_flags} -D USERMOD_ASHISH_CLOCK7SEG

[env:ashish_esp32]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -D USERMOD_ASHISH_CLOCK7SEG
