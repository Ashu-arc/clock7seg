name: Build Ashish Automation clock firmware

# One run builds SEVEN firmware sets: WLED v0.14.4, v0.15.0, v0.15.1, v0.15.3, v0.15.4, v16.0.0 and v16.0.1
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { wled_tag: v0.14.4, node: 18, py: "3.11", pio_pinned: false }
          - { wled_tag: v0.15.0, node: 20, py: "3.11", pio_pinned: false }
          - { wled_tag: v0.15.1, node: 20, py: "3.11", pio_pinned: false }
          - { wled_tag: v0.15.3, node: 20, py: "3.11", pio_pinned: false }
          - { wled_tag: v0.15.4, node: 20, py: "3.11", pio_pinned: false }
          # WLED 16 needs exactly the tool versions listed in its requirements.txt (PlatformIO 6.1.17, Python 3.12)
          - { wled_tag: v16.0.0, node: 20, py: "3.12", pio_pinned: true }
          - { wled_tag: v16.0.1, node: 20, py: "3.12", pio_pinned: true }
    steps:
      - uses: actions/checkout@v4
        with:
          path: mine

      - name: Get WLED source (${{ matrix.wled_tag }})
        run: git clone --depth 1 --branch "${{ matrix.wled_tag }}" https://github.com/wled/WLED.git wled || git clone --depth 1 --branch "${{ matrix.wled_tag }}" https://github.com/Aircoookie/WLED.git wled

      - name: Add clock usermod, welcome and info page name, AP name, unique build number
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          cp -r mine/usermods/ashish_clock_7seg wled/usermods/
          cp mine/platformio_override.ini wled/platformio_override.ini
          cd wled
          # old library pin that no longer resolves (harmless when not present)
          sed -i 's|ESPAsyncWebServer.git *@ *2.2.1|ESPAsyncWebServer.git#v2.2.1|' platformio.ini
          python3 - <<'PY'
          import os, re
          # ---- 1) register the usermod ----
          if os.path.exists("wled00/usermods_list.cpp"):
              # WLED 0.15.x: list file
              p = "wled00/usermods_list.cpp"
              s = open(p, encoding="utf-8").read()
              add = "UsermodManager::add" if "UsermodManager::add" in s else "usermods.add"
              s = s.replace('#include "wled.h"', '#include "wled.h"\n#ifdef USERMOD_ASHISH_CLOCK7SEG\n  #include "../usermods/ashish_clock_7seg/usermod_ashish_clock_7seg.h"\n#endif', 1)
              i = s.index("void registerUsermods()")
              j = s.index("{", i) + 1
              s = s[:j] + "\n  #ifdef USERMOD_ASHISH_CLOCK7SEG\n  %s(new UsermodAshishClock7Seg());\n  #endif" % add + s[j:]
              open(p, "w", encoding="utf-8").write(s)
              print("usermod registered with", add, "(usermods_list.cpp)")
          else:
              # WLED 16.x: usermods are libraries listed in custom_usermods
              d = "usermods/ashish_clock_7seg"
              open(d + "/library.json", "w").write('{\n  "name": "ashish_clock_7seg",\n  "build": { "libArchive": false }\n}\n')
              open(d + "/ashish_clock_7seg.cpp", "w").write('#include "usermod_ashish_clock_7seg.h"\n\nstatic UsermodAshishClock7Seg ashish_clock_7seg;\nREGISTER_USERMOD(ashish_clock_7seg);\n')
              print("usermod registered as library (WLED 16 style): library.json + .cpp created")
          # ---- 2) unique build number (browsers keep old pages when VERSION never changes) ----
          p = "wled00/wled.h"
          s = open(p, encoding="utf-8").read()
          m = re.search(r"#define VERSION (\d+)", s)
          if m:
              newv = int(m.group(1)) + int(os.environ.get("RUN_NUMBER", "0"))
              s = s[:m.start()] + "#define VERSION %d" % newv + s[m.end():]
              open(p, "w", encoding="utf-8").write(s)
              print("build number", m.group(1), "->", newv)
          else:
              print("WARNING: VERSION not found")
          # ---- 2b) factory defaults: India time zone (IST), internet time (NTP) on, Indian NTP pool ----
          try:
              p = "wled00/wled.h"
              s = open(p, encoding="utf-8").read()
              s, n1 = re.subn(r"(currentTimezone\s+_INIT\()\d+(\))", r"\g<1>14\g<2>", s)          # 14 = IST (India)
              s, n2 = re.subn(r"(ntpEnabled\s+_INIT\()false(\))", r"\g<1>true\g<2>", s)
              s, n3 = re.subn(r'(ntpServerName\[\d+\]\s+_INIT\()"[^"]*"(\))', r'\g<1>"in.pool.ntp.org"\g<2>', s)
              open(p, "w", encoding="utf-8").write(s)
              print("defaults patched: timezone", n1, "ntp on", n2, "ntp server", n3)
              if not (n1 and n3):
                  print("WARNING: some factory defaults not found in wled.h (set time zone in Time & Macros after install)")
          except Exception as e:
              print("WARNING defaults patch:", e)
          # ---- 3) welcome page name ----
          try:
              p = "wled00/data/welcome.htm"
              s = open(p, encoding="utf-8").read()
              tag = '\n\t\t\t<h2 style="margin:0 0 14px 0;color:#ffb300;letter-spacing:1px"><b>Ashish Automation</b></h2>'
              m = re.search(r"<h1[^>]*>[^<]*Welcome[^<]*</h1>", s)
              if m:
                  s = s[:m.end()] + tag + s[m.end():]
                  print("welcome page patched")
              else:
                  m = re.search(r"<body[^>]*>", s)
                  if m:
                      s = s[:m.end()] + tag + s[m.end():]
                      print("welcome page patched (after body)")
                  else:
                      print("WARNING: welcome page not patched")
              open(p, "w", encoding="utf-8").write(s)
          except Exception as e:
              print("WARNING welcome patch:", e)
          # ---- 4) info page name (centred under the WLED version line) ----
          try:
              p = "wled00/data/index.js"
              lines = open(p, encoding="utf-8").read().split("\n")
              tag = '<br><b style="font-size:22px;color:#ffb300">Ashish Automation</b>'
              done = False
              for n, line in enumerate(lines):
                  if "${i.ver}" in line and "<br><br><table>" in line:
                      k = line.rfind("<br><br><table>")
                      lines[n] = line[:k] + tag + line[k:]
                      done = True
                      break
              open(p, "w", encoding="utf-8").write("\n".join(lines))
              print("info page name added" if done else "WARNING: info page version line not found")
          except Exception as e:
              print("WARNING info patch:", e)
          PY
          # default WiFi access point name
          sed -i 's|^#define DEFAULT_AP_SSID .*|#define DEFAULT_AP_SSID     "CLOCK (Ashish Automation)"|' wled00/const.h
          sed -i 's|Connect to WLED-AP to setup again|Connect to CLOCK (Ashish Automation) to setup again|' wled00/set.cpp
          grep -n "DEFAULT_AP_SSID" wled00/const.h
          # default LED count 53 (the start LED count itself comes from the -D PIXEL_COUNTS=53 flag in platformio_override.ini)
          sed -i -E 's|^([[:space:]]*)#define DEFAULT_LED_COUNT [0-9]+|\1#define DEFAULT_LED_COUNT 53|' wled00/const.h
          grep -n "DEFAULT_LED_COUNT" wled00/const.h | head -3
          ls usermods/ashish_clock_7seg

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}
      - name: Install tools
        run: |
          # esptool lives in its own environment so it can not disturb PlatformIO
          python -m venv /tmp/esptoolenv
          /tmp/esptoolenv/bin/pip install esptool
          cd wled
          if [ "${{ matrix.pio_pinned }}" = "true" ]; then
            pip install -r requirements.txt      # the exact PlatformIO version WLED 16 expects
          else
            pip install platformio
          fi
          pio --version
          npm ci
          # rebuild the web pages so the page changes are really inside the firmware
          rm -f wled00/html_*.h
          npm run build

      - name: Build ESP8266 (4MB) and ESP32
        run: |
          # FIX for WLED 16: PlatformIO runs the esptool package "postinstall" script as the bare command
          # "package-postinstall.py". The runner cannot find it (exit code 127) and the ESP32 build dies.
          # This tiny helper on the PATH runs the real script from the package folder (or does nothing).
          sudo tee /usr/local/bin/package-postinstall.py > /dev/null <<'EOS'
          #!/bin/sh
          if [ -f "./package-postinstall.py" ]; then python3 ./package-postinstall.py || true; fi
          exit 0
          EOS
          sudo chmod +x /usr/local/bin/package-postinstall.py
          cd wled
          # second try: a package that failed to finish installing is already unpacked, so a retry usually passes
          for i in 1 2; do
            if pio run -e ashish_esp8266 -e ashish_esp32; then break; fi
            if [ "$i" = "2" ]; then echo "build failed twice"; exit 1; fi
            echo "---- retrying build ----"
          done
          # WLED 16 cleans the .pio build folder later, so keep the ESP32 boot files now (needed for the first-install file)
          mkdir -p ../keep
          cp -f .pio/build/ashish_esp32/bootloader.bin .pio/build/ashish_esp32/partitions.bin ../keep/ || true
          ls -la ../keep

      - name: Build ESP8266 1MB (optional)
        continue-on-error: true
        run: |
          cd wled
          pio run -e ashish_esp8266_1m

      - name: Collect .bin files
        run: |
          mkdir out
          cd wled
          TAG="${{ matrix.wled_tag }}"
          echo "--- release folder ---"
          ls -la build_output/release || true
          pick() {  # $1 = build env, $2 = name used by WLED in build_output/release
            if [ -f ".pio/build/$1/firmware.bin" ]; then echo ".pio/build/$1/firmware.bin"; return; fi
            ls build_output/release/*_$2.bin 2>/dev/null | head -1
          }
          F8266=$(pick ashish_esp8266 ESP8266)
          F32=$(pick ashish_esp32 ESP32)
          F01=$(pick ashish_esp8266_1m ESP01)
          echo "found: $F8266 | $F32 | $F01"
          cp "$F8266" "../out/Ashish_Clock_${TAG}_ESP8266_4MB.bin"
          cp "$F32"   "../out/Ashish_Clock_${TAG}_ESP32_update.bin"
          if [ -n "$F01" ]; then cp "$F01" "../out/Ashish_Clock_${TAG}_ESP8266_1MB_cable_only.bin"; else echo "1MB build skipped"; fi
          ls -la ../out

      - name: Make ESP32 first-install file (optional)
        continue-on-error: true
        run: |
          cd wled
          TAG="${{ matrix.wled_tag }}"
          FW="../out/Ashish_Clock_${TAG}_ESP32_update.bin"
          K=../keep
          B=.pio/build/ashish_esp32
          first() { for p in "$@"; do if [ -f "$p" ]; then echo "$p"; return 0; fi; done; return 0; }
          # bootloader: saved copy, build folder, then search everywhere
          LOADER=$(first "$K/bootloader.bin" "$B/bootloader.bin")
          [ -n "$LOADER" ] || LOADER=$(find .pio build_output ~/.platformio/packages -name 'bootloader_dio_40m.bin' 2>/dev/null | head -1 || true)
          [ -n "$LOADER" ] || LOADER=$(find .pio ~/.platformio/packages -name 'bootloader*.bin' 2>/dev/null | head -1 || true)
          # partition table: saved copy, build folder, else generate it from WLED's csv
          PART=$(first "$K/partitions.bin" "$B/partitions.bin")
          if [ -z "$PART" ]; then
            GEN=$(find ~/.platformio/packages -name gen_esp32part.py | head -1)
            python "$GEN" tools/WLED_ESP32_4MB_1MB_FS.csv /tmp/partitions.bin
            PART=/tmp/partitions.bin
          fi
          BOOT=$(find ~/.platformio/packages -name boot_app0.bin | head -1 || true)
          echo "bootloader=$LOADER partitions=$PART boot_app0=$BOOT firmware=$FW"
          for f in "$LOADER" "$PART" "$BOOT" "$FW"; do
            if [ -z "$f" ] || [ ! -f "$f" ]; then echo "ERROR: a file needed for the first-install bin is missing (see line above)"; exit 1; fi
          done
          /tmp/esptoolenv/bin/esptool --chip esp32 merge-bin -o "../out/Ashish_Clock_${TAG}_ESP32_first_install.bin" \
            --flash-mode dio --flash-size 4MB \
            0x1000 "$LOADER" 0x8000 "$PART" 0xe000 "$BOOT" 0x10000 "$FW"
          ls -la ../out

      - name: Publish release (download links work on phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ashish-clock-${{ matrix.wled_tag }}-${{ github.run_number }}
          name: Ashish Automation clock - WLED ${{ matrix.wled_tag }} - build ${{ github.run_number }}
          files: out/*.bin
